<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULANG KAJI SAINS TAHUN 4 (2026)</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --correct: #10b981;
            --wrong: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        #particles-canvas, #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        #particles-canvas { z-index: 0; }
        #confetti-canvas { z-index: 10; }

        header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            z-index: 1;
        }

        header h1 {
            color: var(--accent);
            font-size: 1.4rem;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        header p {
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.12);
            position: relative;
            z-index: 1;
        }

        .card { display: flex; flex-direction: column; }
        .hidden { display: none !important; }

        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        .pop-correct {
            animation: popSuccess 0.4s ease-out forwards;
            border-color: var(--correct) !important;
            background-color: rgba(16, 185, 129, 0.25) !important;
            color: #6ee7b7 !important;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4) !important;
        }

        .shake-screen { animation: screenShake 0.45s ease-in-out forwards; }
        .shake-wrong {
            border-color: var(--wrong) !important;
            background-color: rgba(239, 68, 68, 0.25) !important;
            color: #fca5a5 !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4) !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            15%, 45%, 75% { transform: translateX(-8px) rotate(-1deg); }
            30%, 60%, 90% { transform: translateX(8px) rotate(1deg); }
        }

        .streak-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 0.85rem;
            color: #f97316;
            background: rgba(249, 115, 22, 0.15);
            border: 1px solid rgba(249, 115, 22, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .streak-active { opacity: 1; transform: scale(1.05); }

        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-field, .select-field, .textarea-field {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 1rem;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }

        .textarea-field { min-height: 60px; }
        .select-field option { background: var(--card-bg); color: white; }

        .btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn:hover { background-color: var(--accent-hover); }

        .sub-q-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            transition: all 0.3s ease;
        }

        .sub-q-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }

        .section-header {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 16px;
            border-left: 4px solid var(--accent);
        }

        .diagram-container {
            width: 100%;
            background: #ffffff;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diagram-container svg { max-width: 100%; height: auto; max-height: 220px; }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover { background: rgba(255,255,255,0.1); }

        .explanation {
            background: rgba(0,0,0,0.3);
            border-left: 4px solid var(--accent);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .score-display {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent);
            margin: 12px 0;
            text-align: center;
        }

        .whatsapp-btn { background-color: #25d366; color: white; }

        canvas#sketchpad {
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            background: #ffffff;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            margin-bottom: 10px;
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>🧪 ULANG KAJI SAINS TAHUN 4 (2026)</h1>
        <p>Format Interaktif Lengkap (38 Markah)</p>
    </header>

    <div class="container" id="main-container">
        
        <!-- Mula Ujian -->
        <div id="start-card" class="card fade-in">
            <div style="font-size:3.5rem; text-align:center; margin-bottom:12px;">📝 🔬 🚀</div>
            <h2 style="color: var(--accent); text-align:center; margin-bottom:12px;">Maklumat Murid:</h2>
            <div class="input-group">
                <label>NAMA PENUH MURID:</label>
                <input type="text" id="student-name" class="input-field" placeholder="" oninput="this.value = this.value.toUpperCase()">
            </div>
            <div class="input-group">
                <label>KELAS:</label>
                <select id="student-class" class="select-field">
                    <option value="">-- PILIH KELAS --</option>
                    <option value="4 JANNATUL ADNIN">4 JANNATUL ADNIN</option>
                    <option value="4 JANNATUL FIRDAUS">4 JANNATUL FIRDAUS</option>
                    <option value="4 JANNATUN NAIM">4 JANNATUN NAIM</option>
                </select>
            </div>
            <button class="btn" onclick="startQuiz()">Mula Latihan 🚀</button>
        </div>

        <!-- Kad Soalan -->
        <div id="quiz-card" class="card hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div style="display:flex; align-items:center;">
                    <span id="question-num" class="section-header" style="margin-bottom:0;">Soalan 1</span>
                    <div id="streak-badge" class="streak-container" style="margin-left:8px;">
                        <span>🔥</span> <span id="streak-count">2x STREAK</span>
                    </div>
                </div>
                <span id="score-tracker" style="color: var(--accent); font-weight: bold;">Markah: 0 / 38</span>
            </div>

            <div id="diagram-box" class="diagram-container hidden"></div>
            <div id="question-text" style="font-size:1rem; font-weight:600; margin-bottom:16px;"></div>
            <div id="interactive-body"></div>
            
            <div id="explanation-box" class="explanation hidden"></div>
            <button id="next-btn" class="btn hidden" style="background:#3b82f6; color:white; margin-top:10px;" onclick="nextQuestion()">Soalan Seterusnya ➔</button>
        </div>

        <!-- Keputusan -->
        <div id="result-card" class="card hidden" style="text-align: center;">
            <div style="font-size: 3.5rem; margin-bottom:8px;">🏆</div>
            <h2>Keputusan Ulang Kaji Sains Tahun 4</h2>
            <div id="final-score" class="score-display">0 / 38</div>
            <p id="result-text" style="color: var(--text-sub); margin-bottom: 20px;"></p>

            <button class="btn whatsapp-btn" onclick="sendWhatsApp()">💬 WhatsApp Guru</button>
            <button class="btn" onclick="restartQuiz()" style="background:#334155; color:white; margin-top:10px;">🔄 Cuba Lagi</button>
        </div>

    </div>

    <footer>
        Ulang Kaji Akademik • Hakcipta Panitia Sains SEBARU 2026
    </footer>

    <script>
        // --- EFEK VISUAL PARTICLES & CONFETTI ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        const confettiCanvas = document.getElementById('confetti-canvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let particlesArray = [], confettiArray = [], confettiAnimationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4; this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(245, 158, 11, ${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < 50; i++) particlesArray.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        const confettiColors = ['#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#ec4899', '#fde047'];
        class ConfettiPiece {
            constructor() {
                this.x = Math.random() * confettiCanvas.width;
                this.y = Math.random() * -confettiCanvas.height;
                this.size = Math.random() * 8 + 6;
                this.color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                this.speedY = Math.random() * 3 + 2; this.speedX = (Math.random() - 0.5) * 2;
                this.rotation = Math.random() * 360; this.rotationSpeed = (Math.random() - 0.5) * 10;
            }
            update() {
                this.y += this.speedY; this.x += this.speedX; this.rotation += this.rotationSpeed;
            }
            draw() {
                confettiCtx.save(); confettiCtx.translate(this.x, this.y);
                confettiCtx.rotate((this.rotation * Math.PI) / 180);
                confettiCtx.fillStyle = this.color;
                confettiCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
                confettiCtx.restore();
            }
        }

        function triggerConfetti() {
            confettiArray = [];
            for (let i = 0; i < 100; i++) confettiArray.push(new ConfettiPiece());
            if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
            animateConfetti();
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiArray.forEach((c, index) => {
                c.update(); c.draw();
                if (c.y > confettiCanvas.height) confettiArray[index] = new ConfettiPiece();
            });
            confettiAnimationId = requestAnimationFrame(animateConfetti);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); initParticles(); animateParticles();

        // --- EFEK BUNYI ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playClickSound() {
            try {
                const ctx = getAudioContext(); const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        function playCorrectSound() {
            try {
                const ctx = getAudioContext(); const now = ctx.currentTime;
                const osc1 = ctx.createOscillator(), gain1 = ctx.createGain();
                osc1.type = 'sine'; osc1.frequency.setValueAtTime(523.25, now);
                gain1.gain.setValueAtTime(0.15, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.connect(gain1); gain1.connect(ctx.destination); osc1.start(now); osc1.stop(now + 0.3);
            } catch (e) {}
        }

        function playWrongSound() {
            try {
                const ctx = getAudioContext(); const now = ctx.currentTime;
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now);
                gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.25);
            } catch (e) {}
        }

        function playFanfareSound() {
            try {
                const ctx = getAudioContext();
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const now = ctx.currentTime + (idx * 0.12);
                    const osc = ctx.createOscillator(), gain = ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.3);
                });
            } catch (e) {}
        }

        // --- DATA SOALAN UPSA 2026 ---
        const quizData = [
            // BAHAGIAN A (10 SOALAN)
            {
                section: "BAHAGIAN A (Soalan 1)",
                type: "mcq",
                q: "Rajah menunjukkan sistem pernafasan manusia. Antara yang berikut, padanan organ pernafasan X, Y, dan Z yang manakah betul?",
                diagram: `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 120 15 C 100 15 90 28 90 45 C 90 60 95 70 105 78 L 105 165 L 135 165 L 135 78 C 145 70 150 60 150 45 C 150 28 140 15 120 15 Z" fill="none" stroke="#475569" stroke-width="2.5"/>
                    <rect x="110" y="28" width="20" height="12" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
                    <text x="50" y="36" font-size="11" font-weight="bold" fill="#b45309">Organ X</text>
                    <line x1="75" y1="34" x2="110" y2="34" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2,2"/>
                    <rect x="116" y="52" width="8" height="38" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
                    <text x="185" y="70" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="end">Organ Y</text>
                    <line x1="124" y1="68" x2="160" y2="68" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="2,2"/>
                    <path d="M 85 95 C 68 95 62 115 62 140 C 62 160 80 165 105 155 Z" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
                    <path d="M 155 95 C 172 95 178 115 178 140 C 178 160 160 165 135 155 Z" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
                    <text x="188" y="132" font-size="11" font-weight="bold" fill="#b91c1c">Organ Z</text>
                    <line x1="165" y1="128" x2="182" y2="128" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
                </svg>`,
                options: [
                    { text: "A. X: Peparu | Y: Trakea | Z: Hidung", correct: false },
                    { text: "B. X: Hidung | Y: Trakea | Z: Peparu", correct: true },
                    { text: "C. X: Trakea | Y: Peparu | Z: Hidung", correct: false },
                    { text: "D. X: Hidung | Y: Peparu | Z: Trakea", correct: false }
                ],
                exp: "X ialah Hidung, Y ialah Trakea, dan Z ialah Peparu."
            },
            {
                section: "BAHAGIAN A (Soalan 2)",
                type: "mcq",
                q: "Rajah menunjukkan seekor belalang. Bahagian manakah yang merupakan organ pernafasan belalang?",
                diagram: `<svg viewBox="0 0 250 120" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 35 45 C 25 45 20 55 25 65 C 30 75 45 75 50 65 Z" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
                    <circle cx="32" cy="53" r="3" fill="#0f172a"/>
                    <path d="M 28 47 Q 20 30 10 25" stroke="#15803d" stroke-width="1.5" fill="none"/>
                    <path d="M 32 46 Q 28 28 22 20" stroke="#15803d" stroke-width="1.5" fill="none"/>
                    <text x="10" y="18" font-size="10" font-weight="bold" fill="#b91c1c">S</text>
                    <line x1="12" y1="20" x2="22" y2="28" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
                    <path d="M 22 62 Q 18 68 24 72" stroke="#15803d" stroke-width="1.5" fill="none"/>
                    <text x="12" y="85" font-size="10" font-weight="bold" fill="#b91c1c">U</text>
                    <line x1="16" y1="80" x2="22" y2="68" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
                    <path d="M 50 48 L 85 48 L 80 72 L 48 70 Z" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
                    <path d="M 65 46 Q 130 35 195 48 Q 130 58 65 46 Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
                    <text x="130" y="25" font-size="10" font-weight="bold" fill="#b91c1c">R</text>
                    <line x1="130" y1="28" x2="130" y2="42" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
                    <path d="M 80 52 Q 130 52 180 58 Q 170 78 80 72 Z" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
                    <line x1="98" y1="53" x2="98" y2="73" stroke="#16a34a" stroke-width="1"/>
                    <line x1="116" y1="54" x2="116" y2="74" stroke="#16a34a" stroke-width="1"/>
                    <line x1="134" y1="55" x2="134" y2="75" stroke="#16a34a" stroke-width="1"/>
                    <line x1="152" y1="56" x2="152" y2="73" stroke="#16a34a" stroke-width="1"/>
                    <circle cx="107" cy="65" r="2" fill="#dc2626"/>
                    <circle cx="125" cy="66" r="2" fill="#dc2626"/>
                    <circle cx="143" cy="67" r="2" fill="#dc2626"/>
                    <circle cx="161" cy="66" r="2" fill="#dc2626"/>
                    <text x="135" y="102" font-size="10" font-weight="bold" fill="#b91c1c">T</text>
                    <line x1="135" y1="92" x2="125" y2="69" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
                    <path d="M 75 68 L 110 32 L 140 85" stroke="#15803d" stroke-width="2.5" fill="none"/>
                </svg>`,
                options: [
                    { text: "A. R", correct: false },
                    { text: "B. S", correct: false },
                    { text: "C. T", correct: true },
                    { text: "D. U", correct: false }
                ],
                exp: "Belalang bernafas menggunakan spirakel yang terletak di bahagian abdomen (T)."
            },
            {
                section: "BAHAGIAN A (Soalan 3)",
                type: "mcq",
                q: "Antara yang berikut, manakah merupakan organ perkumuhan manusia?",
                diagram: `<svg viewBox="0 0 240 105" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(10,5)">
                        <rect x="0" y="0" width="105" height="42" rx="4" fill="#f1f5f9" stroke="#475569"/>
                        <text x="52.5" y="21" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Organ P (Jantung)</text>
                    </g>
                    <g transform="translate(125,5)">
                        <rect x="0" y="0" width="105" height="42" rx="4" fill="#f1f5f9" stroke="#475569"/>
                        <text x="52.5" y="21" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">Organ Q (Peparu)</text>
                    </g>

        let currentQ = 0, score = 0, streak = 0, maxStreak = 0;

        function updateStreak(isCorrect) {
            const streakBadge = document.getElementById('streak-badge');
            const streakCount = document.getElementById('streak-count');
            if (isCorrect) {
                streak++; if (streak > maxStreak) maxStreak = streak;
                if (streak >= 2) {
                    streakCount.innerText = `${streak}x STREAK`;
                    streakBadge.classList.add('streak-active');
                }
            } else {
                streak = 0; streakBadge.classList.remove('streak-active');
            }
        }

        function triggerScreenShake() {
            const container = document.getElementById('main-container');
            container.classList.remove('shake-screen'); void container.offsetWidth;
            container.classList.add('shake-screen');
            setTimeout(() => container.classList.remove('shake-screen'), 500);
        }

        function startQuiz() {
            playClickSound();
            studentName = document.getElementById('student-name').value.trim();
            studentClass = document.getElementById('student-class').value;

            if (!studentName || !studentClass) {
                alert("Sila masukkan nama penuh murid dan pilih kelas anda!");
                return;
            }

            score = 0; currentQ = 0; streak = 0; maxStreak = 0;
            document.getElementById('start-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');
            loadQuestion();

        function selectMcqOption(idx) {
            const q = quizData[currentQ];
            const btns = document.querySelectorAll('.option-btn');
            const isCorrect = q.options[idx].correct;

            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (q.options[i].correct) btn.classList.add('pop-correct');
                else if (i === idx) btn.classList.add('shake-wrong');
            });

            if (isCorrect) {
                score += 1; updateStreak(true); playCorrectSound();
            } else {
                updateStreak(false); playWrongSound(); triggerScreenShake();
            }

            showExplanation(q.exp);
        }

        function applyBoxFeedback(boxId, isCorrect) {
            const el = document.getElementById(boxId);
            if (!el) return;
            if (isCorrect) el.classList.add('pop-correct');
            else el.classList.add('shake-wrong');
        }

        function checkBQ1() {
            const a1 = document.getElementById('bq1-1').value;
            const a2 = document.getElementById('bq1-2').value;
            const cb = document.querySelectorAll('input[name="bq1-cb"]:checked');

            if (!a1 || !a2) { alert("Sila pilih jawapan bagi bahagian (a)!"); return; }

            let subScore = 0;
            const isA1 = a1 === "Haba";
            const isA2 = a2 === "Bunyi";
            if (isA1) subScore += 1;
            if (isA2) subScore += 1;
            applyBoxFeedback('box-bq1-a', isA1 && isA2);

            let selectedVals = Array.from(cb).map(c => c.value);
            const isB = selectedVals.includes("1") && selectedVals.includes("3") && selectedVals.length === 2;
            if (isB) subScore += 2;
            applyBoxFeedback('box-bq1-b', isB);

            if (subScore >= 3) { updateStreak(true); playCorrectSound(); }
            else { updateStreak(false); playWrongSound(); triggerScreenShake(); }

            score += subScore;
            showExplanation(`Markah Bahagian B (Soalan 1): ${subScore}/4 Markah.<br>${quizData[currentQ].exp}`);
        }

        function isCanvasBlank(canvas) {
            const ctx = canvas.getContext('2d');
            const pixelBuffer = new Uint32Array(
                ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer
            );
            return !pixelBuffer.some(color => color !== 0);
        }

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }

        function restartQuiz() {
            playClickSound(); currentQ = 0; score = 0; streak = 0; maxStreak = 0;
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('start-card').classList.remove('hidden');
        }

        // --- CANVAS LAKARAN ---
        let isDrawing = false;
        function initCanvas() {
            const canvas = document.getElementById('sketchpad');
            if(!canvas) return;
            canvas.width = canvas.parentElement.clientWidth - 10;
            const ctx = canvas.getContext('2d');
            ctx.lineWidth = 3; ctx.strokeStyle = "#000000";

            function startDraw(e) { isDrawing = true; ctx.beginPath(); draw(e); }
            function endDraw() { isDrawing = false; ctx.beginPath(); }
            function draw(e) {
                if(!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
                const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
                ctx.lineTo(x, y); ctx.stroke();
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchend', endDraw);
            canvas.addEventListener('touchmove', draw);
        }

        function clearCanvas() {
            const canvas = document.getElementById('sketchpad');
            if(!canvas) return;
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        }
